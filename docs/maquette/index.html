<title>Eternal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
/* Concept : une appli de poche, calme et clinique. Le niveau de preuve est l'élément visuel premier
   (lettre + intensité d'une seule teinte), les couleurs d'état (cible / à voir / hors cible) restent séparées. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#13202C; --muted:#586878; --line:#D9E0E7; --soft:#F5F7F9;
  --accent:#1B3A5C; --accent-ink:#FFFFFF;
  --ev:#17607F; --ev-soft:#DCEBF2;
  --ok:#2C7A4B; --ok-bg:#E1F1E7; --warn:#9A6208; --warn-bg:#F8EBD0; --bad:#A93A28; --bad-bg:#F8DDD7;
  --disc:#59506F; --disc-bg:#E7E4EF;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C141C; --surface:#152130; --ink:#E6EDF3; --muted:#9BAABA; --line:#263648; --soft:#101B27;
  --accent:#8DB4DD; --accent-ink:#0C141C; --ev:#6FB8D6; --ev-soft:#1B3445;
  --ok:#6CC38A; --ok-bg:#16301F; --warn:#E3B05B; --warn-bg:#3A2D12; --bad:#EE8D7C; --bad-bg:#3C1D17;
  --disc:#B9AEDB; --disc-bg:#2A2540; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C141C; --surface:#152130; --ink:#E6EDF3; --muted:#9BAABA; --line:#263648; --soft:#101B27;
  --accent:#8DB4DD; --accent-ink:#0C141C; --ev:#6FB8D6; --ev-soft:#1B3445;
  --ok:#6CC38A; --ok-bg:#16301F; --warn:#E3B05B; --warn-bg:#3A2D12; --bad:#EE8D7C; --bad-bg:#3C1D17;
  --disc:#B9AEDB; --disc-bg:#2A2540; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{height:100%;display:flex;justify-content:center;align-items:stretch}
.phone{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg);min-width:0}
@media (min-width:600px){
  .shell{align-items:center}
  .phone{height:min(840px,100%);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgba(10,25,40,.14)}
}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.65rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.98rem;font-weight:700}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.data{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.list{display:flex;flex-direction:column;gap:0;padding:0;margin:0;list-style:none}
.list>li{border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.tap{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 0;min-width:0;text-decoration:none}
.tap>.grow{flex:1;min-width:0}
.chev{color:var(--muted);flex:none}
.sample{font-size:.74rem;font-weight:600;color:var(--disc);background:var(--disc-bg);padding:3px 8px;border-radius:99px;white-space:nowrap}

/* niveau de preuve : lettre + intensité d'une teinte */
.ev{display:inline-flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px;border-radius:6px;font-family:var(--f-data);font-weight:500;font-size:.82rem;border:1.5px solid var(--ev);color:var(--ev)}
.ev-A{background:var(--ev);color:var(--surface)}
.ev-B{background:color-mix(in srgb,var(--ev) 55%,var(--surface));border-color:transparent;color:var(--surface)}
.ev-C{background:var(--ev-soft)}
.ev-D{border-style:dotted;background:transparent}
.ev-Q,.ev-M{border-color:var(--muted);color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line) 3px 4px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* états */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);background:var(--ok-bg)} .s-warn{color:var(--warn);background:var(--warn-bg)}
.s-bad{color:var(--bad);background:var(--bad-bg)} .s-disc{color:var(--disc);background:var(--disc-bg)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.notice{border-radius:12px;padding:12px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.notice.warn{background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.notice.info{background:var(--ev-soft)}
.verdict{border-left:4px solid var(--ev);background:var(--ev-soft);border-radius:0 12px 12px 0;padding:10px 14px}

/* navigation basse */
.tabs{flex:none;background:var(--surface);border-top:1px solid var(--line);padding-bottom:0}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;background:none;border:0;color:var(--muted);font-size:.72rem;font-weight:600;text-decoration:none;min-width:0}
.tab[aria-current="page"]{color:var(--accent)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ressenti */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-data);font-size:1.05rem}
.mood[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:11px 0}
.box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center}
.check[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.check[aria-pressed="true"] .box::after{content:"";width:10px;height:5px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}

/* mesures */
.val{font-family:var(--f-data);font-size:1.15rem;font-weight:500;white-space:nowrap}
.val small{font-size:.74rem;color:var(--muted);font-weight:400}
.big{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.spark{width:70px;height:26px;flex:none}
.spark path{fill:none;stroke:var(--muted);stroke-width:1.6}
.spark circle{fill:var(--ink)}
.bar{position:relative;height:12px;border-radius:6px;overflow:hidden;display:flex;background:var(--soft)}
.bar i{display:block;height:100%}
.z-ok{background:color-mix(in srgb,var(--ok) 55%,var(--surface))}
.z-warn{background:color-mix(in srgb,var(--warn) 55%,var(--surface))}
.z-bad{background:color-mix(in srgb,var(--bad) 55%,var(--surface))}
.z-disc{background:repeating-linear-gradient(135deg,var(--disc-bg) 0 4px,color-mix(in srgb,var(--disc) 45%,var(--surface)) 4px 5px)}
.bar-wrap{position:relative;padding-top:6px}
.dot{position:absolute;top:0;width:4px;height:24px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.ticks{position:relative;height:30px;font-size:.7rem;color:var(--muted);font-family:var(--f-data)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap;text-align:center;line-height:1.15}
.ticks span::before{content:"";display:block;width:1px;height:5px;background:var(--muted);margin:0 auto 2px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-data);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .thr{stroke:var(--warn);stroke-width:1;stroke-dasharray:4 3}
.chart .line{fill:none;stroke:var(--ink);stroke-width:2}
.chart .pt{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.chart .last{fill:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.pt-line{display:flex;gap:10px;align-items:flex-start}
.pt-line p{margin:0;min-width:0;font-size:.93rem}
.pmid{font-family:var(--f-data);font-size:.76rem;color:var(--muted);white-space:nowrap}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:.9rem}
input[type=search],input[type=number],select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
label{font-size:.84rem;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
.sheet-bg{position:absolute;inset:0;background:rgba(8,18,28,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--surface);border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.phone{position:relative}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:.9rem;z-index:30}
.switch{width:48px;height:28px;border-radius:99px;border:1px solid var(--line);background:var(--soft);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--surface)}
pre.payload{margin:0;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--f-data);font-size:.76rem;overflow-x:auto;white-space:pre}
.disclaimer{font-size:.78rem;color:var(--muted);text-align:center;padding-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell"><div class="phone" id="phone">

</div></div>

var MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function fmt(v, d){ return Number(v).toFixed(d).replace('.', ','); }
function dlabel(s){ var p = s.split('-'); return MOIS[+p[1]-1] + ' ' + p[0].slice(2); }
var ST = {ok:'Dans la cible', warn:'À regarder', bad:'Hors cible', disc:'Zone discutée'};

var MARQ = {
  ldl:{nom:'LDL-C', long:'Cholestérol LDL', unit:'g/L', dec:2, fiche:'biomarqueur-ldl-cholesterol-total-hdl', ev:'A',

    bar:{min:0.4,max:2.0,zones:[[0.4,1.16,'ok'],[1.16,2.0,'warn']],ticks:[[1.16,'1,16']]},

    status:function(v){return v<1.16?{c:'ok',t:'Sous la cible de prévention'}:{c:'warn',t:'Au-dessus de la cible de prévention'};},

    src:'ESC/EAS 2019 (PMID 31504418), consulté le 2026-11-01', leviers:['avoine','statines','exercice']},

    bar:{min:4.5,max:7.5,zones:[[4.5,5.7,'ok'],[5.7,6.5,'warn'],[6.5,7.5,'bad']],ticks:[[5.7,'5,7'],[6.5,'6,5']]},
    thr:[5.7,6.5],
    status:function(v){return v<5.7?{c:'ok',t:'Sous le seuil de prédiabète'}:v<6.5?{c:'warn',t:'Zone de prédiabète (ADA 2026)'}:{c:'bad',t:'Seuil diagnostique atteint : à confirmer par un 2e test'};},

};
var ORDER = ['ldl','ferr','a1c','vitd','ta'];

var LEV = {

         ['B','En conditions réelles (essai n = 194, 16 semaines, 6 g/j) : aucune différence sur l’HbA1c, la glycémie ni le LDL-C.','40571100'],

    verdict:'Les hypolipémiants les mieux prouvés ; en prévention primaire, l’intérêt dépend du risque de départ.', sum:'Infarctus RR 0,67, mortalité toutes causes RR 0,92 (prévention primaire).',

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function badge(l){ var k = (l==='?'||l==='Q')?'Q':l; return '<span class="ev ev-'+k+'" title="Niveau de preuve '+(k==='Q'?'inconnu [?]':k)+'">'+(k==='Q'?'?':k)+'</span>'; }

function spark(m){
  var h = m.hist, min = Math.min.apply(null,h.map(function(p){return p[1];})), max = Math.max.apply(null,h.map(function(p){return p[1];}));
  var rng = max-min || 1, pts = h.map(function(p,i){ return [4+i*(62/(h.length-1)), 22-((p[1]-min)/rng)*18]; });
  return '<svg class="spark" viewBox="0 0 70 26" aria-hidden="true"><path d="M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join('L')+'"/><circle cx="'+pts[pts.length-1][0]+'" cy="'+pts[pts.length-1][1]+'" r="3"/></svg>';
}
function rangeBar(m){
  var b = m.bar, span = b.max-b.min, v = Math.min(b.max, Math.max(b.min, last(m)[1]));
  var pc = function(x){ return ((x-b.min)/span*100).toFixed(2); };
  return '<div class="bar-wrap"><div class="bar">'+b.zones.map(function(z){return '<i class="z-'+z[2]+'" style="width:'+((z[1]-z[0])/span*100).toFixed(2)+'%"></i>';}).join('')+'</div><span class="dot" style="left:'+pc(v)+'%"></span></div>'
    +'<div class="ticks">'+b.ticks.map(function(t){return '<span style="left:'+pc(t[0])+'%">'+esc(t[1])+'</span>';}).join('')+'</div>';
}
function chart(m){
  var W=340,H=170,L=34,R=14,T=14,B=26, h=m.hist.map(function(p){return {t:Date.parse(p[0]),v:p[1]};});
  var vals = h.map(function(p){return p.v;}).concat(m.thr);
  var lo = Math.min.apply(null,vals), hi = Math.max.apply(null,vals), pad=(hi-lo)*0.18||1; lo-=pad; hi+=pad;
  var t0 = h[0].t, t1 = h[h.length-1].t;
  var X = function(t){return L+(t-t0)/(t1-t0||1)*(W-L-R);}, Y = function(v){return T+(hi-v)/(hi-lo)*(H-T-B);};
  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Évolution de '+esc(m.nom)+'">';
  [0,.5,1].forEach(function(f){ var v=lo+(hi-lo)*f; s += '<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(L-5)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+fmt(v, m.dec>0?m.dec:0)+'</text>'; });
  m.thr.forEach(function(v){ s += '<line class="thr" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(W-R)+'" y="'+(Y(v)-4).toFixed(1)+'" text-anchor="end">seuil '+fmt(v,m.dec)+'</text>'; });
  s += '<path class="line" d="M'+h.map(function(p){return X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1);}).join('L')+'"/>';
  h.forEach(function(p,i){ var lastp = i===h.length-1; s += '<circle class="'+(lastp?'last':'pt')+'" cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(lastp?5:4)+'"/><text x="'+X(p.t).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':lastp?'end':'middle')+'">'+dlabel(m.hist[i][0])+'</text>'; });
  return s+'</svg>';
}

  if(S.sheet){
    var d = document.createElement('div'); d.id='sheet-root'; d.className='sheet-bg';
    d.innerHTML = '<form class="sheet" id="addform"><h2>Ajouter une mesure</h2><div><label for="mk">Marqueur</label><select id="mk">'+ORDER.map(function(k){return '<option value="'+k+'"'+(S.sheet.k===k?' selected':'')+'>'+esc(MARQ[k].nom)+' ('+esc(MARQ[k].unit)+')</option>';}).join('')+'</select></div>'
      +'<div><label for="mv">Valeur</label><input id="mv" type="number" step="any" inputmode="decimal" required></div>'
      +'<div class="small muted">La mesure est enregistrée sur cet appareil et se compare tout de suite aux seuils de la fiche.</div>'
      +'<div class="row"><button type="button" class="btn ghost" data-close style="flex:1">Annuler</button><button type="submit" class="btn" style="flex:1">Enregistrer</button></div></form>';
    ph.appendChild(d); var mv = d.querySelector('#mv'); if(mv) mv.focus();
  }
  if(S.toast){ var t = document.createElement('div'); t.id='toast-root'; t.className='toast'; t.setAttribute('role','status'); t.textContent=S.toast; ph.appendChild(t); }
}
function toast(msg){ S.toast = msg; renderOverlay(); setTimeout(function(){ S.toast=''; renderOverlay(); }, 2200); }

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-mood],[data-done],[data-obj],[data-sheet],[data-close],[data-share],[data-toast]'); if(!t) return;
  if(t.dataset.mood){ S.mood = +t.dataset.mood; lsSet('mood', S.mood); route(); }
  else if(t.dataset.done){ S.done[t.dataset.done] = !S.done[t.dataset.done]; lsSet('done', S.done); route(); }
  else if(t.dataset.obj){ S.obj = t.dataset.obj; route(); }
  else if(t.hasAttribute('data-sheet')){ S.sheet = {k:t.dataset.k||''}; renderOverlay(); }
  else if(t.hasAttribute('data-close')){ S.sheet = null; renderOverlay(); }
  else if(t.hasAttribute('data-share')){ S.share = !S.share; route(); }
  else if(t.dataset.toast){ toast(t.dataset.toast); }
});
document.addEventListener('input', function(e){ if(e.target.id==='q'){ S.q = e.target.value; route(); } });
document.addEventListener('submit', function(e){
  if(e.target.id!=='addform') return; e.preventDefault();
  var k = document.getElementById('mk').value, v = parseFloat(document.getElementById('mv').value), m = MARQ[k];
  if(isNaN(v)) return;
  var p = [TODAY, v]; if(m.show) p.push(last(m)[2]);
  m.hist.push(p); S.sheet = null; location.hash = '#mesure-'+k; route(); toast('Mesure enregistrée sur cet appareil');
});
window.addEventListener('hashchange', function(){ route(); document.getElementById('screen').scrollTop = 0; });
route();
</script>
